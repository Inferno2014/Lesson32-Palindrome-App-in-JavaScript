<!DOCTYPE html>
<html>
    <head>
        <title>Palindrome App Using JavaScript</title>
        <style>
            body {
                font-size: 200%;
            }
        </style>
    </head>
    <body>
    <h1>Palindrome App Using JavaScript</h1>
    <script>
        function palindrome(myString) {
            var input = myString.replace(/[^A-Z0-9]/ig,
                "").toLowerCase();
           var reversedinput = input.split( '' ).reverse().join( '' );
           if (input === reversedinput) {
            document.write("<div>" + myString + " is a palindrome </div>");
           }else {
            document.write("<div>" + myString + " is not a palindrome </div>");
           }
        }
        palindrome("madam")
    </script>
    </body>
</html>
