<!DOCTYPE html>
<html>

<head>
    <title>Change to Random Colours</title>
    <style>
        body {
            text-align: center;
            padding: 30px;
        }

        button {
            padding: 20px;
            margin: 10px;
            border-radius: 20px;
        }
    </style>
</head>

<body>
    <button onclick="changeColour()">Click to Change Background Colour</button>
    <script>
        function changeColour() {
            var randomColor = "#" + Math.floor(Math.random() * 16777215).toString(16);
            document.body.style.backgroundColor = randomColor;
        }
    </script>
</body>

</html>
